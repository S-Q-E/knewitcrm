services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knewit
      POSTGRES_PASSWORD: knewit
      POSTGRES_DB: knewit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tests/fixtures/knewit_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests/fixtures/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  pgdata:
