name: lint-tests

on:
  push:
  pull_request:
  workflow_dispatch: # manual production deploy (pick the tag in the UI)

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knewit
          POSTGRES_PASSWORD: knewit
          POSTGRES_DB: knewit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knewit -d knewit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://knewit:knewit@localhost:5432/knewit
      SECRET_KEY: ci-secret-key
      ADMIN_EMAIL: admin-test@example.com
      ADMIN_PASSWORD: admin-test-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts
      - name: Apply knewit fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f tests/fixtures/knewit_schema.sql
          psql "$DATABASE_URL" -f tests/fixtures/seed.sql
      - name: Migrate
        run: alembic -c backend/alembic.ini upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knewit
          POSTGRES_PASSWORD: knewit
          POSTGRES_DB: knewit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knewit -d knewit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://knewit:knewit@localhost:5432/knewit
      SECRET_KEY: ci-secret-key
      ADMIN_EMAIL: admin-test@example.com
      ADMIN_PASSWORD: admin-test-password-1
      E2E_BASE_URL: http://localhost:8099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Install frontend
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f tests/fixtures/knewit_schema.sql
          psql "$DATABASE_URL" -f tests/fixtures/seed.sql
          alembic -c backend/alembic.ini upgrade head
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Start backend
        run: |
          nohup python -m uvicorn backend.app.main:app --port 8099 > backend-e2e.log 2>&1 &
          sleep 6
          curl -sf http://localhost:8099/api/health
      - name: Run Playwright
        run: npm run e2e
        working-directory: frontend

  docker-build:
    # Catches a broken Dockerfile before Railway does. No push: Railway
    # builds from source on deploy; this is a pure build check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t knewitcrm:${{ github.sha }} .

  actionlint:
    # Lints this workflow file itself (Step 16a audit finding: secrets must
    # not gate steps via `if:` conditions).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  deploy-staging:
    # Auto-deploy on every push to develop, after all gates are green.
    needs: [lint-tests, frontend, e2e, docker-build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_STAGING }}
        run: |
          npm i -g @railway/cli
          railway up --project "$RAILWAY_PROJECT_ID" --environment staging --service "$RAILWAY_SERVICE"
      - name: Staging smoke
        # No `if:` on secrets here: an empty password is passed through and
        # smoke.sh skips the authenticated checks itself (exit 0).
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_STAGING_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_STAGING_PASSWORD }}
        run: scripts/smoke.sh

  deploy-production:
    # Release by tag (git tag v1.2.0 && git push origin v1.2.0) or manually
    # via workflow_dispatch. The `production` environment should require
    # reviewers (manual approval) — see docs/DEPLOY.md.
    needs: [lint-tests, frontend, e2e, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_PRODUCTION }}
        run: |
          npm i -g @railway/cli
          railway up --project "$RAILWAY_PROJECT_ID" --environment production --service "$RAILWAY_SERVICE"
      - name: Next step
        run: echo "Run scripts/smoke.sh against the production domain manually (see docs/DEPLOY.md)."
