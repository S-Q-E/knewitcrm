name: lint-tests

on:
  push:
  pull_request:

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knewit
          POSTGRES_PASSWORD: knewit
          POSTGRES_DB: knewit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knewit -d knewit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://knewit:knewit@localhost:5432/knewit
      SECRET_KEY: ci-secret-key
      ADMIN_EMAIL: admin-test@example.com
      ADMIN_PASSWORD: admin-test-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts
      - name: Apply knewit fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f tests/fixtures/knewit_schema.sql
          psql "$DATABASE_URL" -f tests/fixtures/seed.sql
      - name: Migrate
        run: alembic -c backend/alembic.ini upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knewit
          POSTGRES_PASSWORD: knewit
          POSTGRES_DB: knewit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knewit -d knewit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://knewit:knewit@localhost:5432/knewit
      SECRET_KEY: ci-secret-key
      ADMIN_EMAIL: admin-test@example.com
      ADMIN_PASSWORD: admin-test-password-1
      E2E_BASE_URL: http://localhost:8099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Install frontend
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f tests/fixtures/knewit_schema.sql
          psql "$DATABASE_URL" -f tests/fixtures/seed.sql
          alembic -c backend/alembic.ini upgrade head
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Start backend
        run: |
          nohup python -m uvicorn backend.app.main:app --port 8099 > backend-e2e.log 2>&1 &
          sleep 6
          curl -sf http://localhost:8099/api/health
      - name: Run Playwright
        run: npm run e2e
        working-directory: frontend
